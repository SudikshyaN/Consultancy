<aside class="dashboard-sidebar">

  <!-- Brand / Logo -->
  <div class="sidebar-brand">
    <div class="brand-logo-wrap">
      <img class="brand-logo" src="logo.png" alt="Bidesh Padhna Logo" />
    </div>
    <div class="brand-copy">
      <strong class="brand-name">Bidesh Padhna</strong>
      
    </div>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav" aria-label="Dashboard Navigation">
    <ul class="sidebar-menu">
      @for (item of items; track item.path) {
        <li class="sidebar-item-wrap">
          <a
            [routerLink]="item.path"
            routerLinkActive="active"
            class="sidebar-item"
            [attr.aria-label]="item.label"
          >
            <span class="sidebar-icon" [innerHTML]="item.icon"></span>
            <span class="sidebar-label">{{ item.label }}</span>
            <span class="sidebar-active-dot"></span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <!-- Spacer -->
  <div class="sidebar-spacer"></div>

  <!-- Logout -->
  <button type="button" class="logout-button" (click)="logout()" aria-label="Log out">
    <span class="sidebar-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </span>
    <span class="sidebar-label">Logout</span>
  </button>

</aside>
