<section id="journey" class="process page-shell">
  <div class="process-intro">
    <span class="section-label">How it works</span>
    
  </div>

  <div class="destination-container">
    <h1>Choose your destination</h1>
    <p>Select a country to open a dedicated detail page with visa guidance, study flow, and planning notes.</p>

    <div class="country-grid">
      @for (country of countries; track country.slug) {
        <a
          class="country-card"
          [class.active]="isActiveCountry(country.slug)"
          [routerLink]="['/destinations', country.slug]"
        >
          <img [src]="country.flag" [alt]="country.name + ' flag'" />
          <h3>{{ country.name }}</h3>
          <span>{{ country.visa }}</span>
        </a>
      }
    </div>
  </div >
</section>
</section>
