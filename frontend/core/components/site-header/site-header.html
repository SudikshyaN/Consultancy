<header class="site-header">
  <div class="page-shell header-inner">
    <a class="brand-mark" routerLink="/">
      <img class="brand-emblem" src="assets/logo.png" alt="Bidesh Padhna logo">
      <span class="brand-copy">
        <strong>Bidesh Padhna</strong>
        <small>Foreign Education Consultancy</small>
      </span>
    </a>


    <nav class="nav-links" aria-label="Primary">
      @for (item of navItems; track item.path) {
      <a (click)="routes(item.path)" >
        {{ item.label }}
      </a>
      }
    </nav>

    <button type="" class="lang-toggle">
      
      <a routerLink="/login">
        Login/Signup </a>
    </button>
  </div>

</header>
