<section class="dashboard-card-content free-tools-page">
  <div class="page-header">
    <p class="eyebrow">Student toolkit</p>
    <h1>Free Tools</h1>
  </div>

  <div class="tools-grid">
    @for (tool of tools; track tool.title) {
      <article class="tool-card">
        <h2>{{ tool.title }}</h2>
        <p>{{ tool.description }}</p>
        <button type="button" (click)="openTool(tool)">{{ tool.action }}</button>
      </article>
    }
  </div>

  <!-- <section class="tool-panel">
    <p class="eyebrow">Selected tool</p>
    <h2>{{ selectedTool.title }}</h2>
    <p>{{ selectedTool.detail }}</p>
  </section> -->
</section>
