<app-layout>
  <div class="login-page">
    <div class="login-card">
      <h2>{{ isLoginMode ? 'Login' : 'Sign Up' }}</h2>

      <p *ngIf="errorMessage" class="form-message error">{{ errorMessage }}</p>
      <p *ngIf="successMessage" class="form-message success">{{ successMessage }}</p>

      <form [formGroup]="authForm" (ngSubmit)="onSubmit()">
        <div *ngIf="!isLoginMode">
          <input type="text" formControlName="name" placeholder="Full Name" />
          <small *ngIf="authForm.get('name')?.touched && authForm.get('name')?.invalid">
            Name must be at least 2 characters.
          </small>
        </div>

        <input type="email" formControlName="email" placeholder="Email" />
        <small *ngIf="authForm.get('email')?.touched && authForm.get('email')?.invalid">
          Enter a valid email address.
        </small>

        <input type="password" formControlName="password" placeholder="Password" />
        <small *ngIf="authForm.get('password')?.touched && authForm.get('password')?.invalid">
          Password must be at least 6 characters.
        </small>

        <button type="submit" [disabled]="isLoading">
          {{ isLoading ? 'Please wait...' : (isLoginMode ? 'Login' : 'Create Account') }}
        </button>
      </form>

      <button type="button" (click)="toggleMode()" class="toggle">
        {{ isLoginMode ? 'No account? Sign up' : 'Already have an account? Login' }}
      </button>
    </div>
  </div>
</app-layout>
